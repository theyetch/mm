        new Typed('#typed', {
            strings: [
                'Hello, I’m Marcelo.',
                'Hola, soy Marcelo.', // Spanish
                'Hallo, ich heiße Marcelo.', // German
                'Wei, vinei Marcelo.', // Kwa'aar
            ],
            typeSpeed: 130,    // ms per character typed
            backSpeed: 120,    // ms per character deleted
            backDelay: 2000,  // pause before deleting
            startDelay: 300,
            loop: true,
            showCursor: true
        });
    </script>
